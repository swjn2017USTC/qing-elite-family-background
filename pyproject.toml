[project]
name = "qing-elite-family-background"
version = "0.1.0"
description = "Micro-study: family political-educational capital and career entry among Qing bureaucratic elites, 1644-1820"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1.0",
    "httpx>=0.27.0",
    "matplotlib>=3.9.0",
    "networkx>=3.7",
    "openai>=1.50.0",
    "pandas>=2.2.0",
    "pandera>=0.33.1",
    "pyarrow>=17.0.0",
    "pydantic>=2.9.0",
    "pymupdf>=1.24.0",
    "pypinyin>=0.55.0",
    "pyyaml>=6.0.0",
    "rapidfuzz>=3.9.0",
    "scipy>=1.14.0",
    "snakemake>=9.27.0",
    "splink>=4.0.17",
    "statsmodels>=0.14.0",
    "tenacity>=9.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qing_elite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
