# 官职标准化与 tier 映射（P02）
#
# 本文件是 P02 官员总体的**唯一**官职裁决来源；每条规则都可人工审核。
# 解析结果（office_id -> tier）输出到 output/tables/p02_office_tier_map.csv 供逐条核对：
# 任何 tier 变化应先改这里，再重跑 `uv run python -m qing_elite.build_universe`。
#
# 依据：
# - CBDB `OFFICE_CODES.c_office_chn`（清代 office code，dy=20 为主）
# - CGED-Q JSL `官职一`（原始转录字符串，含简繁混用、异体字与修饰前缀，需先标准化）
#
# 原则：
# 1. tier 只由**实质任职**决定；带「銜」的加衔、赠官、荣誉职一律排除（记 excluded）。
# 2. 同一人可同时属于多个 tier；`officials_master.highest_office_tier` 取最高层。
# 3. 无法判定的一律记 `unknown`，不得猜测（`unknown != 0`）。

version: 1
phase: P02
study_window:
  start: 1644
  end: 1820

