    (5) 先判機構關鍵詞類別（省級／京官／武職…），再與 categories 的聯集做最長匹配；
    (6) 再與 known_other_offices 匹配以記錄「非 D 但已知」的排除原因；
    未能匹配者記 `office_core=unknown`，不猜測。
