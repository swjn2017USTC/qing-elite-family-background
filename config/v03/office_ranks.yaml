# U08R 官职品级表（config/v03/office_ranks.yaml）
#
# 重要限定：
#   1. **本表是策展表，不是从冻结 release 读出来的**。CGED-Q 公开版没有品级字段
#      （`官缺等级` 是「衝繁難」类缺分特征、`缺分` 是要缺/簡缺，均非品级），CBDB
#      OFFICE_CODES 在本 release 也没有 rank 列。
#   2. 因此每行都带 `basis` 与 `verification_status`；`verification_status: pending`
#      表示**尚未对照原书核验**，下游若用品级必须显式排除或标注为未核验。
#   3. 只列研究总体中实际出现的官称；不在表内的官称一律 `rank_class=null` +
#      `unmapped_reason`，不猜。
#
# rank_class 用 1–9 的品级数（正/從合并为级数，如正二品与從二品都记 2）；
# rank_side 保留正/從。

version: 1
basis: "《清史稿·職官志》所载清代文职官品（策展，待与原书逐条核验）"
verification_status: pending

ranks:
  - {title: 大學士, rank_class: 1, rank_side: 正}
  - {title: 協辦大學士, rank_class: 1, rank_side: 從}
  - {title: 尚書, rank_class: 1, rank_side: 從}
