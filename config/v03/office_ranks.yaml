  - {title: 道員, rank_class: 4, rank_side: 正}
  - {title: 知府, rank_class: 4, rank_side: 從}
  - {title: 同知, rank_class: 5, rank_side: 正}
  - {title: 直隸州知州, rank_class: 5, rank_side: 正}
  - {title: 知州, rank_class: 5, rank_side: 從}
