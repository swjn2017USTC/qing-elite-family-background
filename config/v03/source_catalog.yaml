# V0.3 候选来源目录（config/v03/source_catalog.yaml）
#
# 与 source_probes.yaml 分工：
#   - 本文件 = **curated metadata**：覆盖年代、人群、kin/career 范围、条款、体量估计。
#     凡是机器可验证的字段（access_type / bulk / api / scan / machine_readable）必须与
#     data/interim_v03/probe_results.json 的实际观测一致，不得凭印象填写。
#   - source_probes.yaml + --probe = **machine facts**。
#
# kin_coverage_grade 是本阶段新增的关键判断（决定数据方案）：
#   BROAD   系统记载父/祖/曾祖并大量旁系与姻亲（同年齿录、同官录、硃卷）
#   PARTIAL 系统记载直系三代，旁系不系统（CBDB 对清代地方官的覆盖）
#   NARROW  只有配偶或"家族角色"标签，无父—子边（上海图书馆家谱图谱）
#   NONE    不载亲属（缙绅录、职官库）
#
# notes 必须写明判断依据；无法核实的写 evidence_confidence: LOW 并说明待核实项。

version: 1
catalog_version: catalog-v1

sources:
