    kin_scope: "KIN_DATA 亲属码：父(75)/祖父(62)/曾祖(48) 及部分旁系；另有社会关系表"
    kin_scope_grade: PARTIAL
    kin_population_coverage: LOW
    career_scope: "POSTED_TO_OFFICE_DATA 任官 + ENTRY_DATA 功名"
    access_type: PUBLIC_STRUCTURED
    bulk_available: true
    api_available: true
    scan_available: false
    machine_readable: true
    terms: "未在本阶段核对条款页（cbdb.fas.harvard.edu 对脚本请求 403）；沿用 v0.1 口径：仅学术使用、不再分发原始数据。落盘前须人工核对条款。"
    redistribution: "不再分发原始数据库（README 已声明）"
    local_cache_allowed: true
    estimated_n: "237826 (清人, v0.2 计数); API 全量 SQLite 约 877 MB"
    estimated_ocr_pages: "0"
    automation_score: 0.95
    research_value: 0.8
    evidence_confidence: MEDIUM
    notes: >
      probe: latest.json 返回 sqlite_filename=cbdb_20260926.sqlite3（比 v0.1 冻结的 20260912 更新）；
      HF dataset API 200；/api/query_relatives_2 匿名 GET 200 JSON（王安石 58 条亲属）；
      Harvard Dataverse doi:10.7910/DVN/PAGGQS 全量 200。kin_coverage_grade=PARTIAL 依据：
      v0.2 U02 显示 D 层（地方官）high-only 链接覆盖仅 0.78%、U03 pilot 祖先信息率 0.0（30 人），
      即 CBDB 对清代地方官员的亲属覆盖稀疏，不能单独支撑 exposure。

