# V0.3 文献：来源探测中发现的策展条目（config/v03/literature_manual.yaml）
#
# 检索 API 的 query 覆盖有盲区（例如 2026 年《The History of the Family》的
# Tongguanlu 论文在 Semantic Scholar / Crossref 的关键词检索里都未命中，但它是
# 本课题最关键的来源论文之一）。因此设一个**策展入口**：
#
#   每条必须带 evidence_url（实际读到题录/摘要的页面）与 retrieved_at；元数据
#   （题名/作者/年/刊/DOI）必须来自该页面或 Crossref，不得凭记忆填写。
#
# tier_hint: core 表示该条进入 core（需写 digest）；candidate 表示只登记。
# 策展条目绕过标题主题门槛，因为它的主题相关性已由人工/agent 明确判定。

