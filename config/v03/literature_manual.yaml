  - literature_id_hint: null
    title: "Kin networks of local officials in 19th and Early 20th century China"
    authors: "Shengbin Wei; Cameron Campbell; Qin Xue"
    year: 2026
    venue: "The History of the Family"
    doi: "10.1080/1081602X.2026.2659970"
    url: "https://researchportal.hkust.edu.hk/en/publications/kin-networks-of-local-officials-in-19th-and-early-20th-century-ch/"
    language: en
    query_cluster: "Q6_tongguanlu"
    tier_hint: core
    evidence_url: "https://researchportal.hkust.edu.hk/en/publications/kin-networks-of-local-officials-in-19th-and-early-20th-century-ch/"
    retrieved_at: "2026-09-27"
    abstract: >
      We introduce a new source for the study of the kin networks, qualifications, and careers
      of officials in China in the late nineteenth and early twentieth centuries: a dataset
      constructed from Tongguanlu rosters of officials that include their resumes, degree or
      other qualifications and rosters of their kin. In contrast with other sources that have
      been used to study the social origins of holders of high examination degrees including
      national Jinshi, provincial Juren and exam Gongsheng, Tongguanlu include holders of less
      prestigious purchased degrees and prefectural Shengyuan exam degrees who accounted for a
      large share of officials, especially local ones, in the nineteenth century. Information
      about kin includes not only the names and degrees held by paternal kin but also those of
      maternal kin and affines. We use this dataset to examine the relationship between the
      degrees that officials held and the degrees held by their kin. We find that officials who
      held purchased degrees and low-level Shengyuan examination degrees were less likely than
      holders of higher degrees to have other kin who held degrees and that officials with
      regular and expectant appointments were more likely to have kin with degrees than
      officials with acting appointments.
    notes: >
      Crossref 校验：The History of the Family，2026，license CC BY-NC-ND 4.0；无摘要字段。
      摘要在 HKUST 成果页读取。该论文报告同官录编码数据集规模（28 种版本、18,585 条官员
      记录、80,988 条亲属、90,307 条功名履历），但无公开数据下载入口。

